<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supplier Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 th:text="${supplier.id == null} ? 'Add Supplier' : 'Edit Supplier'"></h2>
    
    <form action="#" th:action="@{/suppliers/save}" th:object="${supplier}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" th:field="*{name}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="text" th:field="*{email}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone:</label>
            <input type="text" th:field="*{phone}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Address:</label>
            <input type="text" th:field="*{address}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/suppliers}" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
